name: build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional pytest -k expression to narrow the test run'
        required: false
        default: ''

jobs:
  tests:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: [ubuntu-22.04, windows-2022]
        tox-env: [py37, py38, py39, py310, py311, nolxml, nohtml5lib]
        include:
          - tox-env: py37
            python-version: 3.7
          - tox-env: py38
            python-version: 3.8
          - tox-env: py39
            python-version: '3.9.13'
          - tox-env: py310
            python-version: '3.10.11'
          - tox-env: py311
            python-version: '3.11.3'
          - tox-env: nolxml
            python-version: '3.11.3'
          - tox-env: nohtml5lib
            python-version: '3.10.11'
        # exclude:
        #   - platform: windows-latest
        #     tox-env: py311

    env:
      TOXENV: ${{ matrix.tox-env }}

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      if: "!endsWith(matrix.python-version, '-dev')"
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up development Python ${{ matrix.python-version }}
      if: endsWith(matrix.python-version, '-dev')
      uses: deadsnakes/action@v2.1.1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade --index-url 'https://:2023-04-16@time-machines-pypi.sealsecurity.io/' pip setuptools build tox coverage
    - name: Test
      run: |
        python -m tox -- -k "${{ inputs.test-filter }}"
      if: inputs.test-filter != ''
    - name: Test (full suite)
      run: |
        python -m tox
      if: inputs.test-filter == ''

  dist:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Install build backend
      run: |
        python -m pip install --upgrade --index-url 'https://:2023-04-16@time-machines-pypi.sealsecurity.io/' pip
        python -m pip install --index-url 'https://:2023-04-16@time-machines-pypi.sealsecurity.io/' build 'hatchling==1.14.0'
    - name: Package
      run: |
        python -m build --no-isolation -s -w
    - name: Upload distributions
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/*
        if-no-files-found: error
